name: PhotoPrism Linux builds and Releases

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40-character develop commit SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: photoprism-build-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  linux:
    name: linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate source SHA
        env:
          SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected exact commit SHA"; exit 1; }

      - name: Checkout exact upstream snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout
        env:
          SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"

      - uses: docker/setup-buildx-action@v3

      - name: Build official production Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/photoprism/resolute/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: photoprism-local:${{ matrix.arch }}
          build-args: |
            BUILD_TAG=dev-${{ inputs.source_sha }}
          cache-from: type=gha,scope=photoprism-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=photoprism-${{ matrix.arch }}

      - name: Smoke test and create release archive
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /opt/photoprism/bin/photoprism "photoprism-local:$ARCH" --version
          mkdir -p dist package
          cid="$(docker create --entrypoint /bin/true "photoprism-local:$ARCH")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/opt/photoprism/." package/
          test -s package/bin/photoprism
          test -d package/assets
          file="photoprism_dev-${SHA:0:12}-linux-$ARCH.tar.gz"
          tar --owner=0 --group=0 --numeric-owner -C package -czf "dist/$file" .
          (cd dist && sha256sum "$file" > "$file.sha256")
          du -h "dist/$file"

      - name: Upload packages for GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: photoprism-${{ matrix.arch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push architecture-specific container image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/969981/photoprism:dev-${SHA:0:12}-$ARCH"
          docker tag "photoprism-local:$ARCH" "$image"
          docker push "$image"

  publish:
    name: Publish GitHub Release and GHCR multiarch manifest
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: photoprism-*
          merge-multiple: true
          path: dist

      - name: Check both archives
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          (cd dist && sha256sum -c *.sha256)

      - name: Publish SHA-specific prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          tag="dev-${SHA:0:12}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA"               --title "PhotoPrism dev ${SHA:0:12}" --prerelease               --notes "Unofficial build of official photoprism/photoprism develop at $SHA. Linux AMD64/ARM64 installations require system libraries. Docker is recommended for most users."
          fi
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multiarch Docker manifest
        shell: bash
        env:
          SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          repo="ghcr.io/969981/photoprism"
          short="${SHA:0:12}"
          docker buildx imagetools create -t "$repo:dev-$short" -t "$repo:edge"             "$repo:dev-$short-amd64" "$repo:dev-$short-arm64"
          docker buildx imagetools inspect "$repo:dev-$short"
